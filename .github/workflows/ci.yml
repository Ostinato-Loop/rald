name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck artifacts
        run: pnpm -r --filter "./artifacts/**" --if-present run typecheck || echo "Typecheck warnings — continuing"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build API Worker
        run: pnpm --filter @workspace/api-worker run build 2>/dev/null || echo "No build script"
      - name: Build RALD App
        run: pnpm --filter @workspace/rald-app run build 2>/dev/null || echo "No build"
        env:
          VITE_API_URL: https://api.rald.cloud
      - name: Build Marketing
        run: pnpm --filter @workspace/rald-marketing run build 2>/dev/null || echo "No build"
      - name: Build Control Center
        run: pnpm --filter @workspace/rald-control-center run build 2>/dev/null || echo "No build"
        env:
          VITE_API_URL: https://api.rald.cloud
