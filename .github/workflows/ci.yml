name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all packages
        run: pnpm -w run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Build Control Center
        run: pnpm --filter @workspace/rald-control-center run build
        env:
          VITE_API_URL: https://api.rald.cloud

      - name: Build Marketing site
        run: pnpm --filter @workspace/rald-marketing run build

      - name: Upload Control Center dist
        uses: actions/upload-artifact@v4
        with:
          name: rald-control-center-dist
          path: artifacts/rald-control-center/dist/public
          retention-days: 1

      - name: Upload Marketing dist
        uses: actions/upload-artifact@v4
        with:
          name: rald-marketing-dist
          path: artifacts/rald-marketing/dist/public
          retention-days: 1
