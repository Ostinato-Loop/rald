name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: false
        default: all
        type: choice
        options: [all, api, control-center, marketing]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-api-worker:
    name: Deploy API Worker
    runs-on: ubuntu-latest
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'api' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Worker-specific dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: artifacts/api-worker

      - name: Deploy API Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: artifacts/api-worker
          command: deploy src/index.ts --name rald-api

  deploy-control-center:
    name: Deploy Control Center
    runs-on: ubuntu-latest
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'control-center' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Control Center
        run: pnpm --filter @workspace/rald-control-center run build
        env:
          VITE_API_URL: https://api.rald.cloud

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy artifacts/rald-control-center/dist/public --project-name=rald-control-center --branch=main

  deploy-marketing:
    name: Deploy Marketing Site
    runs-on: ubuntu-latest
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'marketing' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Marketing site
        run: pnpm --filter @workspace/rald-marketing run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy artifacts/rald-marketing/dist/public --project-name=rald-marketing --branch=main

  notify:
    name: Post Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-api-worker, deploy-control-center, deploy-marketing]
    if: always()
    steps:
      - name: Deployment summary
        run: |
          echo "## RALD Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| API Worker (api.rald.cloud) | ${{ needs.deploy-api-worker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Control Center (admin.rald.cloud) | ${{ needs.deploy-control-center.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Marketing (rald.cloud) | ${{ needs.deploy-marketing.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
