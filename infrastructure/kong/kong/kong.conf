# ============================================================
# RALD Kong Server Configuration
# Place at: /etc/kong/kong.conf on the host
# ============================================================

# Declarative (DBless) mode
database = off
declarative_config = /kong/declarative/kong.yml

# Networking
proxy_listen = 0.0.0.0:8000 reuseport backlog=16384, 0.0.0.0:8443 ssl reuseport backlog=16384
admin_listen = 127.0.0.1:8001, 127.0.0.1:8444 ssl

# SSL — provision via Let's Encrypt or Cloudflare Origin CA
ssl_cert     = /certs/rald.cloud.crt
ssl_cert_key = /certs/rald.cloud.key

# Nginx tuning
nginx_worker_processes = auto
nginx_http_keepalive_requests = 10000
nginx_http_keepalive_timeout = 75s
nginx_proxy_read_timeout = 120s
nginx_proxy_send_timeout = 60s

# Memory limits
nginx_http_client_max_body_size = 10m
mem_cache_size = 256m

# Plugins
plugins = bundled,jwt,key-auth,cors,rate-limiting,http-log,prometheus,request-size-limiting,ip-restriction,response-ratelimiting,request-termination,correlation-id

# Logging
proxy_access_log = /dev/stdout
proxy_error_log  = /dev/stderr
admin_access_log = /dev/stdout
admin_error_log  = /dev/stderr
log_level        = warn

# Cloudflare IP passthrough
real_ip_header    = CF-Connecting-IP
real_ip_recursive = on
trusted_ips       = 173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22

# Performance
upstream_keepalive_pool_size = 512
upstream_keepalive_max_requests = 1000
upstream_keepalive_idle_timeout = 60

# Vitals
vitals = on
