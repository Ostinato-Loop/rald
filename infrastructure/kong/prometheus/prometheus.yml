global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: rald-production
    origin: kong-gateway

scrape_configs:
  - job_name: kong
    static_configs:
      - targets: [kong:8001]
    metrics_path: /metrics

  - job_name: redis
    static_configs:
      - targets: [redis:9121]  # requires redis-exporter sidecar in production
