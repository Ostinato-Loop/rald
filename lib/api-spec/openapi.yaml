openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: RALD Ecosystem API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: RALD Auth operations
  - name: services
    description: Service registry
  - name: credentials
    description: Credential management
  - name: deployments
    description: Deployment management
  - name: metrics
    description: System metrics
  - name: products
    description: RALD product catalog

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List all registered RALD services
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"

  /services/{id}:
    get:
      operationId: getService
      tags: [services]
      summary: Get service details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Service details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /services/{id}/restart:
    post:
      operationId: restartService
      tags: [services]
      summary: Restart a service
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Restart triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAction"

  /credentials:
    get:
      operationId: listCredentials
      tags: [credentials]
      summary: List all credential keys (no values)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Credential metadata list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Credential"
    post:
      operationId: createCredential
      tags: [credentials]
      summary: Store a new credential
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"

  /credentials/{id}:
    patch:
      operationId: rotateCredential
      tags: [credentials]
      summary: Rotate (update) a credential value
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialRotate"
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
    delete:
      operationId: deleteCredential
      tags: [credentials]
      summary: Delete a credential
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /deployments:
    get:
      operationId: listDeployments
      tags: [deployments]
      summary: List deployments across all products
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deployment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deployment"
    post:
      operationId: triggerDeployment
      tags: [deployments]
      summary: Trigger a new deployment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeploymentInput"
      responses:
        "201":
          description: Deployment triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"

  /deployments/{id}:
    get:
      operationId: getDeployment
      tags: [deployments]
      summary: Get deployment details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deployment details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"

  /metrics/summary:
    get:
      operationId: getMetricsSummary
      tags: [metrics]
      summary: Get system-wide metrics summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Metrics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSummary"

  /metrics/services:
    get:
      operationId: getServiceMetrics
      tags: [metrics]
      summary: Per-service health and uptime metrics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Service metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceMetric"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all RALD products
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{slug}/stats:
    get:
      operationId: getProductStats
      tags: [products]
      summary: Get stats for a specific product
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductStats"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6

    AuthToken:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, email, role, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: ["string", "null"]
        role:
          type: string
          enum: [admin, operator, viewer]
        createdAt:
          type: string
          format: date-time

    Service:
      type: object
      required: [id, name, slug, status, product, url, version, lastDeployedAt]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [healthy, degraded, down, deploying, unknown]
        product:
          type: string
        url:
          type: string
        version:
          type: string
        region:
          type: ["string", "null"]
        lastDeployedAt:
          type: string
          format: date-time
        uptime:
          type: ["number", "null"]
        responseTimeMs:
          type: ["number", "null"]

    ServiceAction:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string

    Credential:
      type: object
      required: [id, key, category, lastRotatedAt, createdAt]
      properties:
        id:
          type: string
        key:
          type: string
        category:
          type: string
          enum: [aws, github, supabase, cloudflare, stripe, termii, custom]
        description:
          type: ["string", "null"]
        lastRotatedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: ["string", "null"]
          format: date-time

    CredentialInput:
      type: object
      required: [key, value, category]
      properties:
        key:
          type: string
        value:
          type: string
        category:
          type: string
          enum: [aws, github, supabase, cloudflare, stripe, termii, custom]
        description:
          type: string
        expiresAt:
          type: string
          format: date-time

    CredentialRotate:
      type: object
      required: [value]
      properties:
        value:
          type: string

    Deployment:
      type: object
      required: [id, product, service, status, branch, commitSha, triggeredBy, createdAt]
      properties:
        id:
          type: string
        product:
          type: string
        service:
          type: string
        status:
          type: string
          enum: [pending, building, deploying, success, failed, rolled_back]
        branch:
          type: string
        commitSha:
          type: string
        commitMessage:
          type: ["string", "null"]
        triggeredBy:
          type: string
        duration:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
        cfDeploymentUrl:
          type: ["string", "null"]

    DeploymentInput:
      type: object
      required: [product, service, branch]
      properties:
        product:
          type: string
        service:
          type: string
        branch:
          type: string
        commitMessage:
          type: string

    MetricsSummary:
      type: object
      required: [totalServices, healthyServices, degradedServices, downServices, totalDeployments, successfulDeployments, failedDeployments, activeCredentials, expiringSoonCredentials]
      properties:
        totalServices:
          type: integer
        healthyServices:
          type: integer
        degradedServices:
          type: integer
        downServices:
          type: integer
        totalDeployments:
          type: integer
        successfulDeployments:
          type: integer
        failedDeployments:
          type: integer
        activeCredentials:
          type: integer
        expiringSoonCredentials:
          type: integer
        overallUptimePercent:
          type: number

    ServiceMetric:
      type: object
      required: [serviceId, serviceName, uptime, avgResponseTimeMs, requestsLast24h, errorsLast24h]
      properties:
        serviceId:
          type: string
        serviceName:
          type: string
        uptime:
          type: number
        avgResponseTimeMs:
          type: number
        requestsLast24h:
          type: integer
        errorsLast24h:
          type: integer
        p99LatencyMs:
          type: ["number", "null"]

    Product:
      type: object
      required: [id, name, slug, tagline, domain, color, status, servicesCount]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        tagline:
          type: string
        domain:
          type: string
        color:
          type: string
        status:
          type: string
          enum: [live, beta, coming_soon, maintenance]
        servicesCount:
          type: integer
        activeUsers:
          type: ["integer", "null"]
        mrr:
          type: ["number", "null"]

    ProductStats:
      type: object
      required: [slug, activeUsers, mrr, deployments30d, uptime30d, errorRate]
      properties:
        slug:
          type: string
        activeUsers:
          type: integer
        mrr:
          type: number
        deployments30d:
          type: integer
        uptime30d:
          type: number
        errorRate:
          type: number
        recentDeployments:
          type: array
          items:
            $ref: "#/components/schemas/Deployment"
