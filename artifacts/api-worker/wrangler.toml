name = "rald-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = []

[vars]
ENVIRONMENT = "production"

# Secrets (set via: wrangler secret put <NAME>)
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# RALD_JWT_SECRET
# RALD_ENCRYPTION_KEY

[[routes]]
pattern = "api.rald.cloud/*"
zone_name = "rald.cloud"

[build]
command = ""

[observability]
enabled = true
head_sampling_rate = 1
