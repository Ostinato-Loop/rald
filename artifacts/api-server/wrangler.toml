name = "rald-api"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[env.production]
name = "rald-api"
routes = [
  { pattern = "auth.ostloop.name.ng/*", zone_name = "ostloop.name.ng" }
]

[env.production.vars]
ENVIRONMENT = "production"
