kind = "web"
previewPath = "/"
title = "RALD — Root Authentication & Login Directory"
version = "1.0.0"
id = "artifacts/rald"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20261

[services.development]
run = "pnpm --filter @workspace/rald run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rald", "run", "build" ]
publicDir = "artifacts/rald/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20261"
BASE_PATH = "/"
