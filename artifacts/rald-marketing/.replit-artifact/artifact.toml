kind = "web"
previewPath = "/products/"
title = "RALD Products"
version = "1.0.0"
id = "artifacts/rald-marketing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/products/" ]
localPort = 21457

[services.development]
run = "cd repos/rald && pnpm --filter @workspace/rald-marketing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rald-marketing", "run", "build" ]
publicDir = "artifacts/rald-marketing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21457"
BASE_PATH = "/products/"
